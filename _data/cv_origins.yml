# Joke entries for the Short CV on the homepage (index.html). Below the
# earliest real entry the timeline breaks off, and site.js shows one of these,
# picked at random on each visit, as the entry where the timeline ends.
#
# year:  shown in place of the period; keep it before the earliest real entry.
# event: Markdown, rendered like a _mini_cv body (link a key phrase).
# Entries missing either field are skipped.

- year: "1202"
  event: "Counted the rabbits in [Fibonacci's Liber Abaci](https://en.wikipedia.org/wiki/Liber_Abaci)"
- year: "1494"
  event: "Audited [Luca Pacioli's double-entry books](https://en.wikipedia.org/wiki/Luca_Pacioli)"
- year: "1637"
  event: "Sold Pierre de Fermat [a book with narrow margins](https://en.wikipedia.org/wiki/Fermat%27s_Last_Theorem)"
- year: "1654"
  event: "Asked Pascal and Fermat how to split [the stakes of an unfinished game](https://en.wikipedia.org/wiki/Problem_of_points)"
- year: "1657"
  event: "Checked the expected values in [Christiaan Huygens's book on dice](https://en.wikipedia.org/wiki/Christiaan_Huygens)"
- year: "1693"
  event: "Helped Isaac Newton answer [Samuel Pepys's question about dice](https://en.wikipedia.org/wiki/Newton%E2%80%93Pepys_problem)"
- year: "1713"
  event: "Tossed coins for [Jacob Bernoulli's law of large numbers](https://en.wikipedia.org/wiki/Law_of_large_numbers)"
- year: "1733"
  event: "Drew the first bell curve for [Abraham de Moivre](https://en.wikipedia.org/wiki/De_Moivre%E2%80%93Laplace_theorem)"
- year: "1736"
  event: "Tried to cross each of [Königsberg's seven bridges](https://en.wikipedia.org/wiki/Seven_Bridges_of_K%C3%B6nigsberg) exactly once"
- year: "1738"
  event: "Refused to pay what [the St. Petersburg game](https://en.wikipedia.org/wiki/St._Petersburg_paradox) was worth"
- year: "1763"
  event: "Updated my beliefs after reading [Thomas Bayes's essay](https://en.wikipedia.org/wiki/An_Essay_Towards_Solving_a_Problem_in_the_Doctrine_of_Chances)"
- year: "1777"
  event: "Dropped needles on the floorboards for [the Comte de Buffon](https://en.wikipedia.org/wiki/Buffon%27s_needle_problem)"
- year: "1827"
  event: "Supplied the pollen for [Robert Brown's microscope](https://en.wikipedia.org/wiki/Brownian_motion)"
- year: "1837"
  event: "Counted rare events for [Siméon Denis Poisson](https://en.wikipedia.org/wiki/Poisson_distribution)"
- year: "1858"
  event: "Walked once along [the Möbius strip](https://en.wikipedia.org/wiki/M%C3%B6bius_strip) and came back on the other side"
- year: "1859"
  event: "Checked the first few zeros for [Bernhard Riemann](https://en.wikipedia.org/wiki/Riemann_hypothesis)"
- year: "1889"
  event: "Chose a chord at random three different ways for [Joseph Bertrand](https://en.wikipedia.org/wiki/Bertrand_paradox_%28probability%29)"
- year: "1891"
  event: "Tried to list all the real numbers for [Georg Cantor](https://en.wikipedia.org/wiki/Cantor%27s_diagonal_argument)"
- year: "1900"
  event: "Priced options with [Louis Bachelier](https://en.wikipedia.org/wiki/Louis_Bachelier) in Paris"
- year: "1908"
  event: "Sampled barley for [\"Student\"](https://en.wikipedia.org/wiki/William_Sealy_Gosset) at the Guinness brewery"
- year: "1909"
  event: "Waited in [Agner Erlang's first queue](https://en.wikipedia.org/wiki/Agner_Krarup_Erlang)"
- year: "1912"
  event: "Was there when Russell and Whitehead finally proved that [1 + 1 = 2](https://en.wikipedia.org/wiki/Principia_Mathematica)"
- year: "1913"
  event: "Counted vowels in Eugene Onegin for [Andrey Markov](https://en.wikipedia.org/wiki/Andrey_Markov)"
- year: "1921"
  event: "Found my way home on [George Pólya's two-dimensional lattice](https://en.wikipedia.org/wiki/Random_walk)"
- year: "1931"
  event: "Asked Kurt Gödel to [prove this CV consistent](https://en.wikipedia.org/wiki/G%C3%B6del%27s_incompleteness_theorems)"
- year: "1933"
  event: "Proofread [Kolmogorov's axioms of probability](https://en.wikipedia.org/wiki/Probability_axioms)"
- year: "1948"
  event: "Counted the bits in [Claude Shannon's theory of communication](https://en.wikipedia.org/wiki/A_Mathematical_Theory_of_Communication)"
- year: "1957"
  event: "Brewed percolated coffee for [Broadbent and Hammersley](https://en.wikipedia.org/wiki/Percolation_theory)"
- year: "1959"
  event: "Drew the random edges for [Erdős and Rényi](https://en.wikipedia.org/wiki/Erd%C5%91s%E2%80%93R%C3%A9nyi_model)"
- year: "1961"
  event: "Scattered the points for [Edgar Gilbert's random plane network](https://en.wikipedia.org/wiki/Random_geometric_graph)"
- year: "1974"
  event: "Caught a cold from a neighbour in [Ted Harris's contact process](https://en.wikipedia.org/wiki/Contact_process_%28mathematics%29)"
- year: "1976"
  event: "Lent [Appel and Haken](https://en.wikipedia.org/wiki/Four_color_theorem) four crayons"
- year: "1980"
  event: "Flipped a fair coin for every edge of the square lattice for [Harry Kesten](https://en.wikipedia.org/wiki/Harry_Kesten)"
- year: "1990"
  event: "Switched doors and won the car in [the Monty Hall problem](https://en.wikipedia.org/wiki/Monty_Hall_problem)"
- year: "1994"
  event: "Lent Andrew Wiles [a wider margin](https://en.wikipedia.org/wiki/Wiles%27s_proof_of_Fermat%27s_Last_Theorem)"
- year: "1998"
  event: "Rewired one of my friendships for [Watts and Strogatz](https://en.wikipedia.org/wiki/Watts%E2%80%93Strogatz_model)"
- year: "1999"
  event: "Attached preferentially to the most popular vertex in [the Barabási–Albert model](https://en.wikipedia.org/wiki/Barab%C3%A1si%E2%80%93Albert_model)"
