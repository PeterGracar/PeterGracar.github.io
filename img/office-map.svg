<g role="list">
<g role="listitem"><text class="om-step"><tspan x="609" y="663">1. </tspan><tspan x="647" y="663">Go through the IT Services door opposite </tspan><tspan x="647" dy="40">the School of Mathematics.</tspan></text></g>
<g role="listitem"><text class="om-step"><tspan x="609" y="751">2. </tspan><tspan x="647" y="751">Turn right and follow the signs for </tspan><tspan x="647" dy="40"><tspan class="om-em">Maths Research Deck</tspan>.</tspan></text></g>
</g>
