<svg xmlns="http://www.w3.org/2000/svg" class="om" viewBox="0 0 1764 1372" width="1764" height="1372" role="group">
<style>.om{--om-ground:var(--color-surface-soft,#eceef0);--om-building:var(--color-border,#d4d7db);--om-building-edge:#b3b8bf;--om-focus-building:#c3c7cc;--om-road:var(--color-surface,#ffffff);--om-green:#dde6d6;--om-surface:var(--color-surface,#ffffff);--om-ink:var(--color-text,#1a1a1a);--om-muted:var(--color-text-muted,#5a5f66);--om-casing:#1a1a1a;--om-red:#ad2d14;--om-blue:#53afee;--om-green-route:#79d357;--om-on-red:#ffffff;--om-on-light:#1a1a1a;display:block;font-family:var(--font-body,"Source Sans 3","Segoe UI",Arial,sans-serif);font-size:30px;font-weight:400;line-height:normal}
@media (prefers-color-scheme:dark){.om{--om-ground:var(--color-surface-soft,#262626);--om-building:#333333;--om-building-edge:#4a4a4a;--om-focus-building:#3a3a3a;--om-road:#1c1c1c;--om-green:#25301f;--om-surface:var(--color-surface,#1e1e1e);--om-ink:var(--color-text,#e6e6e6);--om-muted:var(--color-text-muted,#a3a3a3);--om-casing:#141414;--om-red:#e5533a;--om-on-red:#1a1a1a}}
.om .om-ground{fill:var(--om-ground)}
.om .om-green{fill:var(--om-green)}
.om .om-road{fill:none;stroke:var(--om-road);stroke-linecap:round;stroke-linejoin:round}
.om .om-paved{fill:var(--om-road)}
.om .om-building{fill:var(--om-building);stroke:var(--om-building-edge);stroke-width:2;fill-rule:evenodd}
.om .om-building-focus{fill:var(--om-focus-building);stroke:var(--om-building-edge);stroke-width:2;fill-rule:evenodd}
.om .om-casing{fill:none;stroke:var(--om-casing);stroke-width:20;stroke-linejoin:miter}
.om .om-route{fill:none;stroke-width:14;stroke-linejoin:miter}
.om .om-route-a{stroke:var(--om-red)}
.om .om-route-b{stroke:var(--om-blue)}
.om .om-route-c{stroke:var(--om-green-route)}
.om .om-stub{fill:none;stroke-width:7}
.om .om-mark{stroke:var(--om-casing);stroke-width:3}
.om .om-mark-a{fill:var(--om-red)}
.om .om-mark-b{fill:var(--om-blue)}
.om .om-mark-c{fill:var(--om-green-route)}
.om .om-mark-ac{fill:url(#om-grad-ac)}
.om .om-digit{font-size:30px;text-anchor:middle;fill:var(--om-on-light)}
.om .om-digit-a{fill:var(--om-on-red)}
.om .om-digit-ac{stroke:#ffffff;stroke-width:5;stroke-linejoin:round;paint-order:stroke}
.om .om-stop-red{stop-color:var(--om-red)}
.om .om-stop-blue{stop-color:var(--om-blue)}
.om .om-stop-green{stop-color:var(--om-green-route)}
.om .om-star{fill:url(#om-grad-star);stroke:var(--om-casing);stroke-width:2.5;stroke-linejoin:round}
.om .om-box{fill:var(--om-surface);stroke-width:5}
.om .om-a .om-box{stroke:var(--om-red)}
.om .om-b .om-box{stroke:var(--om-blue)}
.om .om-c .om-box{stroke:var(--om-green-route)}
.om .om-swatch{stroke:var(--om-casing);stroke-width:2}
.om .om-a .om-swatch{fill:var(--om-red)}
.om .om-b .om-swatch{fill:var(--om-blue)}
.om .om-c .om-swatch{fill:var(--om-green-route)}
.om .om-title,.om .om-success,.om .om-em{font-weight:700}
.om .om-title,.om .om-step,.om .om-success,.om .om-label-text{fill:var(--om-ink)}
.om .om-label-box{fill:var(--om-surface);stroke:var(--om-ink);stroke-width:2}
.om .om-label-text{text-anchor:middle}
.om .om-place{fill:var(--om-ink);font-size:26px;text-anchor:middle}
.om .om-leader{fill:none;stroke:var(--om-ink);stroke-width:4}
.om .om-leader-head{fill:var(--om-ink)}
.om .om-credit{fill:var(--om-muted);font-size:20px;text-anchor:end}
.om .om-credit-box{fill:var(--om-surface);opacity:.85}</style>
