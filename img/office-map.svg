<text class="om-title" x="1028" y="933">Route C (green)</text>
<g role="list">
<g role="listitem"><text class="om-step"><tspan x="974" y="983">1. </tspan><tspan x="1012" y="983">Enter through Entrance 1 South </tspan><tspan x="1012" dy="40">next to the bike shelter.</tspan></text></g>
<g role="listitem"><text class="om-step"><tspan x="974" y="1071">4. </tspan><tspan x="1012" y="1071">Take the stairs up three floors, then go </tspan><tspan x="1012" dy="40">through the door marked <tspan class="om-em">Maths Research Deck</tspan>.</tspan></text></g>
</g>
